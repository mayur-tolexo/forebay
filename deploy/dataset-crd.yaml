# A dataset is what a user declares: an object in a durable store. It carries a
# declaration and never a measurement, which is the rule RFC-0014 sets for what
# belongs in etcd, so leases and residency are not here and never will be.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: datasets.forebay.io
spec:
  group: forebay.io
  scope: Namespaced
  names:
    plural: datasets
    singular: dataset
    kind: Dataset
    shortNames: [ds]
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      # Status is the control plane's answer and the user's spec is the
      # question, so they are written by different clients and separated here.
      status: {}
    additionalPrinterColumns:
    - {name: Object, type: string, jsonPath: .spec.object}
    - {name: Present, type: boolean, jsonPath: .status.present}
    - {name: Bytes, type: integer, jsonPath: .status.bytes}
    - {name: Age, type: date, jsonPath: .metadata.creationTimestamp}
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required: [object]
            properties:
              object:
                type: string
                minLength: 1
                description: >-
                  Name of the object in the durable store. The store itself is
                  the controller's configuration rather than the user's, so a
                  dataset carries no endpoint and no credentials.
          status:
            type: object
            properties:
              present:
                type: boolean
                description: Whether the store has it. Absent is a dataset waiting for its data, not an error.
              bytes:
                type: integer
                format: int64
              reason:
                type: string
                description: The store's own words when it could not be checked, so absent and unreachable are told apart.
              observedGeneration:
                type: integer
                format: int64
