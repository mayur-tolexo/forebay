<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Forebay: every GPU node's NVMe is split into compute, donated and borrowed pools. The borrowed pool grows when the node is idle and is returned instantly when the job needs it, feeding the GPUs above it from durable backends below.">
<defs>
  <linearGradient id="gGold" gradientUnits="userSpaceOnUse" x1="0" y1="250" x2="0" y2="350"><stop offset="0" stop-color="#FBBF24"/><stop offset="1" stop-color="#B45309"/></linearGradient>
  <linearGradient id="gSlate" gradientUnits="userSpaceOnUse" x1="0" y1="250" x2="0" y2="350"><stop offset="0" stop-color="#64748B"/><stop offset="1" stop-color="#334155"/></linearGradient>
  <linearGradient id="gTeal" gradientUnits="userSpaceOnUse" x1="0" y1="250" x2="0" y2="350"><stop offset="0" stop-color="#2DD4BF"/><stop offset="1" stop-color="#0D9488"/></linearGradient>
  <linearGradient id="gStore" gradientUnits="userSpaceOnUse" x1="100" y1="480" x2="1100" y2="560"><stop offset="0" stop-color="#141C2B"/><stop offset="1" stop-color="#0C1320"/></linearGradient>
  <radialGradient id="gGlowT" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#14B8A6" stop-opacity="0.22"/><stop offset="1" stop-color="#14B8A6" stop-opacity="0"/></radialGradient>
  <radialGradient id="gGlowI" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#6366F1" stop-opacity="0.20"/><stop offset="1" stop-color="#6366F1" stop-opacity="0"/></radialGradient>
  <pattern id="pDots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#182339"/></pattern>
  <filter id="fGlow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="cBar"><rect x="100" y="250" width="1000" height="100" rx="14"/></clipPath>
  <marker id="mUp" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2DD4BF"/></marker>
  <style>
    .f{font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    .lbl{font-size:14px;font-weight:700;letter-spacing:1.4px}
    .sub{font-size:12.5px;fill:#7C8CA6}
    .cap{font-size:11px;fill:#5A6B85;letter-spacing:1.5px;font-weight:700}
    .story{font-size:19px;fill:#E6EDF7}
    .pill{font-size:13px;font-weight:600}
    .foot{font-size:11.5px;fill:#4E5E78}
  </style>
</defs>

<rect width="1200" height="600" rx="18" fill="#070C16"/>
<rect width="1200" height="600" rx="18" fill="url(#pDots)" opacity="0.6"/>
<ellipse cx="600" cy="300" rx="620" ry="260" fill="url(#gGlowT)"/>
<ellipse cx="600" cy="70" rx="520" ry="180" fill="url(#gGlowI)"/>

<!-- accelerators -->
<g class="f">
  <text x="100" y="46" class="cap">ACCELERATORS</text>
    <text x="1100" y="46" font-size="12.5" fill="#A5B4FC" text-anchor="end">the control plane grants the lease, then stays out of the IO path</text>
  <g>
    <rect x="180" y="58" width="120" height="54" rx="11" fill="#3B2408" stroke="#F59E0B" stroke-width="1.6"/>
    <text x="240" y="92" font-size="17" font-weight="700" fill="#FCD34D" text-anchor="middle">GPU</text>
    <rect x="180" y="58" width="120" height="54" rx="11" fill="none" stroke="#FCD34D" stroke-width="2" opacity="0" filter="url(#fGlow)">
      <animate attributeName="opacity" values="0;0.85;0" dur="2.4s" begin="0s" repeatCount="indefinite"/></rect>
  </g>
  <g>
    <rect x="324" y="58" width="120" height="54" rx="11" fill="#3B2408" stroke="#F59E0B" stroke-width="1.6"/>
    <text x="384" y="92" font-size="17" font-weight="700" fill="#FCD34D" text-anchor="middle">GPU</text>
    <rect x="324" y="58" width="120" height="54" rx="11" fill="none" stroke="#FCD34D" stroke-width="2" opacity="0" filter="url(#fGlow)">
      <animate attributeName="opacity" values="0;0.85;0" dur="2.4s" begin="0.4s" repeatCount="indefinite"/></rect>
  </g>
  <g>
    <rect x="468" y="58" width="120" height="54" rx="11" fill="#3B2408" stroke="#F59E0B" stroke-width="1.6"/>
    <text x="528" y="92" font-size="17" font-weight="700" fill="#FCD34D" text-anchor="middle">GPU</text>
    <rect x="468" y="58" width="120" height="54" rx="11" fill="none" stroke="#FCD34D" stroke-width="2" opacity="0" filter="url(#fGlow)">
      <animate attributeName="opacity" values="0;0.85;0" dur="2.4s" begin="0.8s" repeatCount="indefinite"/></rect>
  </g>
  <g>
    <rect x="612" y="58" width="120" height="54" rx="11" fill="#3B2408" stroke="#F59E0B" stroke-width="1.6"/>
    <text x="672" y="92" font-size="17" font-weight="700" fill="#FCD34D" text-anchor="middle">GPU</text>
    <rect x="612" y="58" width="120" height="54" rx="11" fill="none" stroke="#FCD34D" stroke-width="2" opacity="0" filter="url(#fGlow)">
      <animate attributeName="opacity" values="0;0.85;0" dur="2.4s" begin="1.2s" repeatCount="indefinite"/></rect>
  </g>
  <g>
    <rect x="756" y="58" width="120" height="54" rx="11" fill="#3B2408" stroke="#F59E0B" stroke-width="1.6"/>
    <text x="816" y="92" font-size="17" font-weight="700" fill="#FCD34D" text-anchor="middle">GPU</text>
    <rect x="756" y="58" width="120" height="54" rx="11" fill="none" stroke="#FCD34D" stroke-width="2" opacity="0" filter="url(#fGlow)">
      <animate attributeName="opacity" values="0;0.85;0" dur="2.4s" begin="1.6s" repeatCount="indefinite"/></rect>
  </g>
  <g>
    <rect x="900" y="58" width="120" height="54" rx="11" fill="#3B2408" stroke="#F59E0B" stroke-width="1.6"/>
    <text x="960" y="92" font-size="17" font-weight="700" fill="#FCD34D" text-anchor="middle">GPU</text>
    <rect x="900" y="58" width="120" height="54" rx="11" fill="none" stroke="#FCD34D" stroke-width="2" opacity="0" filter="url(#fGlow)">
      <animate attributeName="opacity" values="0;0.85;0" dur="2.4s" begin="2s" repeatCount="indefinite"/></rect>
  </g>
</g>

<!-- data rising into the accelerators -->
<g stroke="#2DD4BF" stroke-width="2.4" stroke-linecap="round" marker-end="url(#mUp)" opacity="0.9">
  <path d="M240 244 V120" stroke-dasharray="10 14"><animate attributeName="stroke-dashoffset" values="72;0" dur="1.6s" repeatCount="indefinite"/></path>
  <path d="M384 244 V120" stroke-dasharray="10 14"><animate attributeName="stroke-dashoffset" values="72;0" dur="1.6s" begin="0.2s" repeatCount="indefinite"/></path>
  <path d="M528 244 V120" stroke-dasharray="10 14"><animate attributeName="stroke-dashoffset" values="72;0" dur="1.6s" begin="0.4s" repeatCount="indefinite"/></path>
  <path d="M672 244 V120" stroke-dasharray="10 14"><animate attributeName="stroke-dashoffset" values="72;0" dur="1.6s" begin="0.6s" repeatCount="indefinite"/></path>
  <path d="M816 244 V120" stroke-dasharray="10 14"><animate attributeName="stroke-dashoffset" values="72;0" dur="1.6s" begin="0.8s" repeatCount="indefinite"/></path>
  <path d="M960 244 V120" stroke-dasharray="10 14"><animate attributeName="stroke-dashoffset" values="72;0" dur="1.6s" begin="1s" repeatCount="indefinite"/></path>
</g>

<!-- the bar: every node's local NVMe -->

<g clip-path="url(#cBar)">
  <rect x="100" y="250" width="380" height="100" fill="url(#gGold)">
    <animate attributeName="width" values="380;380;620;620;380" keyTimes="0;0.34;0.46;0.82;1" dur="11s" repeatCount="indefinite"/>
  </rect>
  <rect x="480" y="250" width="200" height="100" fill="url(#gSlate)">
    <animate attributeName="x" values="480;480;720;720;480" keyTimes="0;0.34;0.46;0.82;1" dur="11s" repeatCount="indefinite"/>
  </rect>
  <rect x="680" y="250" width="420" height="100" fill="url(#gTeal)">
    <animate attributeName="x" values="680;680;920;920;680" keyTimes="0;0.34;0.46;0.82;1" dur="11s" repeatCount="indefinite"/>
    <animate attributeName="width" values="420;420;180;180;420" keyTimes="0;0.34;0.46;0.82;1" dur="11s" repeatCount="indefinite"/>
  </rect>
  <rect x="100" y="250" width="1000" height="26" fill="#FFFFFF" opacity="0.09"/>
</g>
<rect x="100" y="250" width="1000" height="100" rx="14" fill="none" stroke="#2A3A56" stroke-width="1.4"/>

<!-- segment labels track their segments -->
<g class="f" text-anchor="middle">
  <text x="290" y="378" class="lbl" fill="#FBBF24">COMPUTE
    <animate attributeName="x" values="290;290;410;410;290" keyTimes="0;0.34;0.46;0.82;1" dur="11s" repeatCount="indefinite"/></text>
  <text x="290" y="398" class="sub">the job owns it
    <animate attributeName="x" values="290;290;410;410;290" keyTimes="0;0.34;0.46;0.82;1" dur="11s" repeatCount="indefinite"/></text>

  <text x="580" y="378" class="lbl" fill="#94A3B8">DONATED
    <animate attributeName="x" values="580;580;820;820;580" keyTimes="0;0.34;0.46;0.82;1" dur="11s" repeatCount="indefinite"/></text>
  <text x="580" y="398" class="sub">durable, permanent
    <animate attributeName="x" values="580;580;820;820;580" keyTimes="0;0.34;0.46;0.82;1" dur="11s" repeatCount="indefinite"/></text>

  <text x="890" y="378" class="lbl" fill="#2DD4BF">BORROWED
    <animate attributeName="x" values="890;890;1010;1010;890" keyTimes="0;0.34;0.46;0.82;1" dur="11s" repeatCount="indefinite"/></text>
  <text x="890" y="398" class="sub">regenerable only
    <animate attributeName="x" values="890;890;1010;1010;890" keyTimes="0;0.34;0.46;0.82;1" dur="11s" repeatCount="indefinite"/></text>
</g>

<!-- the story, cross-faded with the animation -->
<g class="f" text-anchor="middle">
  <text x="600" y="440" class="story" fill="#5EEAD4">Every node&#8217;s local NVMe. This one is between jobs, so its spare capacity serves the rack.
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.32;0.44;0.84;1" dur="11s" repeatCount="indefinite"/></text>
  <text x="600" y="440" class="story" fill="#FBBF24" opacity="0">The job grew. Capacity came back instantly, dropped and never migrated.
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.36;0.48;0.8;1" dur="11s" repeatCount="indefinite"/></text>
</g>

<!-- durable backends -->
<rect x="100" y="480" width="1000" height="72" rx="14" fill="url(#gStore)" stroke="#2A3A56" stroke-width="1.4"/>
<text x="126" y="508" class="f cap">DURABLE, WHEREVER YOU ALREADY KEEP IT</text>
<g class="f pill" fill="#CBD5E1">
  <rect x="126" y="518" width="78"  height="26" rx="13" fill="#1B2537" stroke="#3B4A63"/><text x="165" y="536" text-anchor="middle">Ceph</text>
  <rect x="212" y="518" width="104" height="26" rx="13" fill="#1B2537" stroke="#3B4A63"/><text x="264" y="536" text-anchor="middle">OpenEBS</text>
  <rect x="324" y="518" width="62"  height="26" rx="13" fill="#1B2537" stroke="#3B4A63"/><text x="355" y="536" text-anchor="middle">S3</text>
  <rect x="394" y="518" width="196" height="26" rx="13" fill="#1B2537" stroke="#3B4A63"/><text x="492" y="536" text-anchor="middle">the array you already own</text>
</g>
<text x="100" y="584" class="f foot">Design phase. Performance claims unproven until measured.</text>
<text x="1100" y="584" class="f foot" text-anchor="end">github.com/mayur-tolexo/forebay</text>
</svg>
