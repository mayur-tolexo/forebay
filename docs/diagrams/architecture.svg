<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" width="1200" height="690" role="img" aria-label="Forebay architecture: a control plane grants leases out of band while GPU nodes split local NVMe into compute, donated and borrowed pools, with pluggable durable backends underneath.">
  <style>
    .f    { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .wm   { font-size: 27px; font-weight: 700; fill: #F1F5F9; letter-spacing: -0.4px; }
    .tag  { font-size: 15px; fill: #94A3B8; }
    .band { font-size: 11px; font-weight: 700; letter-spacing: 1.6px; }
    .lead { font-size: 19px; fill: #E0E7FF; }
    .pill { font-size: 11.5px; font-weight: 600; }
    .cap  { font-size: 11px; fill: #64748B; letter-spacing: 1.2px; font-weight: 600; }
    .seg  { font-size: 10.5px; font-weight: 700; letter-spacing: 0.6px; }
    .note { font-size: 11.5px; fill: #94A3B8; }
    .chip { font-size: 12.5px; font-weight: 700; }
    .foot { font-size: 11px; fill: #475569; }
  </style>
  <defs>
    <marker id="aT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2DD4BF"/>
    </marker>
    <marker id="aS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
    </marker>
    <marker id="aI" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6366F1"/>
    </marker>
  </defs>

  <rect width="1200" height="690" rx="18" fill="#0B1220"/>

  <!-- header -->
  <g class="f">
    <text x="48" y="58" class="wm">forebay</text>
    <text x="1152" y="57" class="tag" text-anchor="end">idle NVMe on your GPU nodes &#8594; the tier that keeps them fed</text>
  </g>

  <!-- control plane -->
  <g class="f">
    <rect x="48" y="94" width="1104" height="98" rx="14" fill="#1E1B4B" stroke="#4F46E5" stroke-width="1.5"/>
    <text x="76" y="126" class="band" fill="#A5B4FC">CONTROL PLANE</text>
    <text x="76" y="158" class="lead">intent &#183; topology &#183; capacity leases &#183; autonomy</text>
    <rect x="906" y="126" width="218" height="30" rx="15" fill="#312E81" stroke="#6366F1" stroke-width="1.2"/>
    <text x="1015" y="146" class="pill" fill="#C7D2FE" text-anchor="middle">never in the IO path</text>
  </g>

  <!-- cp to nodes -->
  <g class="f">
    <line x1="600" y1="192" x2="600" y2="246" stroke="#6366F1" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#aI)"/>
    <text x="616" y="224" class="note" fill="#818CF8">policy and lease grants, out of band</text>
  </g>

  <!-- node cards -->
  <g class="f">
    <!-- card 1 -->
    <rect x="48" y="250" width="336" height="242" rx="14" fill="#111A2B" stroke="#22304A" stroke-width="1.3"/>
    <text x="70" y="278" class="cap">GPU NODE</text>
    <rect x="70" y="292" width="82" height="32" rx="8" fill="#422006" stroke="#F59E0B" stroke-width="1.3"/>
    <text x="111" y="313" class="chip" fill="#FCD34D" text-anchor="middle">GPU</text>
    <text x="164" y="313" class="note" fill="#64748B">400G NIC</text>
    <line x1="111" y1="386" x2="111" y2="332" stroke="#2DD4BF" stroke-width="2" marker-end="url(#aT)"/>
    <text x="124" y="362" class="note" fill="#2DD4BF">feeds</text>
    <text x="70" y="382" class="cap">LOCAL NVMe</text>
    <rect x="70" y="392" width="105" height="36" fill="#422006" stroke="#F59E0B" stroke-width="1.2"/>
    <rect x="175" y="392" width="90"  height="36" fill="#1E293B" stroke="#64748B" stroke-width="1.2"/>
    <rect x="265" y="392" width="97"  height="36" fill="#134E4A" stroke="#14B8A6" stroke-width="1.2"/>
    <text x="122" y="448" class="seg" fill="#FBBF24" text-anchor="middle">COMPUTE</text>
    <text x="220" y="448" class="seg" fill="#94A3B8" text-anchor="middle">DONATED</text>
    <text x="313" y="448" class="seg" fill="#2DD4BF" text-anchor="middle">BORROWED</text>
    <text x="122" y="466" class="note" text-anchor="middle" font-size="10.5">the job owns it</text>
    <text x="220" y="466" class="note" text-anchor="middle" font-size="10.5">durable</text>
    <text x="313" y="466" class="note" text-anchor="middle" font-size="10.5">reclaim = drop</text>

    <!-- card 2 -->
    <rect x="432" y="250" width="336" height="242" rx="14" fill="#111A2B" stroke="#22304A" stroke-width="1.3"/>
    <text x="454" y="278" class="cap">GPU NODE</text>
    <rect x="454" y="292" width="82" height="32" rx="8" fill="#422006" stroke="#F59E0B" stroke-width="1.3"/>
    <text x="495" y="313" class="chip" fill="#FCD34D" text-anchor="middle">GPU</text>
    <text x="548" y="313" class="note" fill="#64748B">400G NIC</text>
    <text x="454" y="382" class="cap">LOCAL NVMe</text>
    <rect x="454" y="392" width="176" height="36" fill="#422006" stroke="#F59E0B" stroke-width="1.2"/>
    <rect x="630" y="392" width="90"  height="36" fill="#1E293B" stroke="#64748B" stroke-width="1.2"/>
    <rect x="720" y="392" width="26"  height="36" fill="#134E4A" stroke="#14B8A6" stroke-width="1.2"/>
    <line x1="700" y1="366" x2="746" y2="366" stroke="#FBBF24" stroke-width="1.6" marker-start="url(#aT)"/>
    <text x="746" y="358" class="note" fill="#FBBF24" text-anchor="end" font-size="10.5">job grew &#8212; capacity reclaimed</text>
    <text x="454" y="466" class="note" font-size="10.5">no migration. borrowed data was regenerable, so it was dropped.</text>

    <!-- card 3 -->
    <rect x="816" y="250" width="336" height="242" rx="14" fill="#111A2B" stroke="#22304A" stroke-width="1.3"/>
    <text x="838" y="278" class="cap">GPU NODE</text>
    <rect x="838" y="292" width="82" height="32" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1.3"/>
    <text x="879" y="313" class="chip" fill="#64748B" text-anchor="middle">GPU</text>
    <text x="932" y="313" class="note" fill="#64748B">idle</text>
    <text x="838" y="382" class="cap">LOCAL NVMe</text>
    <rect x="838" y="392" width="58"  height="36" fill="#422006" stroke="#F59E0B" stroke-width="1.2"/>
    <rect x="896" y="392" width="90"  height="36" fill="#1E293B" stroke="#64748B" stroke-width="1.2"/>
    <rect x="986" y="392" width="144" height="36" fill="#134E4A" stroke="#14B8A6" stroke-width="1.2"/>
    <line x1="1010" y1="366" x2="1130" y2="366" stroke="#2DD4BF" stroke-width="1.6" marker-end="url(#aT)"/>
    <text x="1006" y="358" class="note" fill="#2DD4BF" text-anchor="end" font-size="10.5">idle NVMe lent to the fabric</text>
    <text x="838" y="466" class="note" font-size="10.5">an idle node becomes cache and prefetch capacity for its rack.</text>

    <!-- rack-local peer links -->
    <line x1="392" y1="340" x2="424" y2="340" stroke="#2DD4BF" stroke-width="1.6" marker-start="url(#aT)" marker-end="url(#aT)"/>
    <line x1="776" y1="340" x2="808" y2="340" stroke="#2DD4BF" stroke-width="1.6" marker-start="url(#aT)" marker-end="url(#aT)"/>
    <text x="408" y="330" class="note" fill="#2DD4BF" text-anchor="middle" font-size="10">rack</text>
    <text x="792" y="330" class="note" fill="#2DD4BF" text-anchor="middle" font-size="10">rack</text>
  </g>

  <!-- to durable -->
  <g class="f">
    <line x1="600" y1="492" x2="600" y2="546" stroke="#64748B" stroke-width="1.5" marker-end="url(#aS)"/>
    <text x="616" y="524" class="note">miss, or durability</text>
  </g>

  <!-- durable backends -->
  <g class="f">
    <rect x="48" y="550" width="1104" height="92" rx="14" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
    <text x="76" y="582" class="band" fill="#94A3B8">PLUGGABLE DURABLE BACKENDS</text>
    <text x="76" y="612" class="lead" fill="#CBD5E1">Ceph &#183; OpenEBS &#183; S3 &#183; the array you already own</text>
    <rect x="906" y="580" width="218" height="30" rx="15" fill="#1E293B" stroke="#475569" stroke-width="1.2"/>
    <text x="1015" y="600" class="pill" fill="#CBD5E1" text-anchor="middle">capability-negotiated</text>
  </g>

  <text x="1152" y="672" class="f foot" text-anchor="end">github.com/mayur-tolexo/forebay</text>
</svg>
