<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-label="Forebay borrows the idle NVMe on GPU nodes, caches dataset blocks there so reads are served locally instead of crossing the network, and returns the capacity by deleting those blocks the moment the job needs its disk back.">
<style>
  :root {
    --ink: #0F172A; --muted: #475569; --faint: #94A3B8;
    --card: #FFFFFF; --edge: #CBD5E1; --stage: #F8FAFC;
    --ctl: #4F46E5; --ctl-soft: #E0E7FF;
    --own: #0D9488; --own-soft: #CCFBF1;
    --dur: #475569; --dur-soft: #E2E8F0;
    --hot: #B45309; --hot-soft: #FEF3C7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #E2E8F0; --muted: #94A3B8; --faint: #64748B;
      --card: #111A2B; --edge: #24344E; --stage: #0B1220;
      --ctl: #818CF8; --ctl-soft: #1E1B4B;
      --own: #2DD4BF; --own-soft: #042F2E;
      --dur: #94A3B8; --dur-soft: #1E293B;
      --hot: #FBBF24; --hot-soft: #451A03;
    }
  }
  .f { font-family: ui-sans-serif, -apple-system, "Segoe UI", Inter, Roboto, sans-serif; }
  .h1 { font-size: 30px; font-weight: 800; fill: var(--ink); letter-spacing: -0.4px; }
  .sub { font-size: 16px; fill: var(--muted); }
  .cap { font-size: 13px; font-weight: 700; fill: var(--muted); letter-spacing: 1.1px; }
  .lbl { font-size: 14px; font-weight: 700; fill: var(--ink); }
  .sm { font-size: 12.5px; fill: var(--muted); }
  .tiny { font-size: 11.5px; fill: var(--faint); }
  .rule { font-size: 15px; fill: var(--ink); }
  .card { fill: var(--card); stroke: var(--edge); stroke-width: 1.4; }
</style>

<rect width="1200" height="660" fill="var(--stage)"/>

<g class="f">
  <text x="60" y="56" class="h1">Idle NVMe on a GPU node is storage nobody is using</text>
  <text x="60" y="84" class="sub">Forebay borrows it, serves reads from it, and gives it back the moment the job wants its disk.</text>
</g>

<!-- ================= the node ================= -->
<rect x="60" y="120" width="700" height="300" rx="16" class="card"/>
<text x="84" y="150" class="cap">ONE GPU NODE</text>

<!-- accelerators -->
<g class="f">
  <rect x="84" y="166" width="150" height="62" rx="10" fill="var(--hot-soft)" stroke="var(--hot)" stroke-width="1.3"/>
  <text x="159" y="192" text-anchor="middle" class="lbl">GPUs</text>
  <text x="159" y="211" text-anchor="middle" class="sm">waiting on data</text>
</g>

<!-- the read that matters -->
<g stroke="var(--own)" stroke-width="3.5" fill="none" marker-end="url(#tealArrow)">
  <path d="M560 300 L560 250 L242 250">
    <animate attributeName="stroke-opacity" values="0.45;1;0.45" dur="2.6s" repeatCount="indefinite"/>
  </path>
</g>
<text x="398" y="242" text-anchor="middle" class="f sm" fill="var(--own)">read locally, not over the network</text>
<g class="f">
  <rect x="316" y="158" width="420" height="62" rx="10" fill="none" stroke="var(--edge)" stroke-width="1.2" stroke-dasharray="5 5"/>
  <text x="332" y="180" class="lbl">Dataset blocks, cached on borrowed space</text>
  <text x="332" y="202" class="sm">Immutable, so nothing goes stale and nothing needs invalidating.</text>
</g>

<!-- the disk -->
<text x="84" y="288" class="f cap">ITS LOCAL DISK</text>
<g>
  <clipPath id="bar"><rect x="84" y="300" width="652" height="56" rx="9"/></clipPath>
  <g clip-path="url(#bar)">
    <rect x="84" y="300" width="392" height="56" fill="var(--hot-soft)"/>
    <rect x="476" y="300" width="260" height="56" fill="var(--own-soft)">
      <animate attributeName="width" values="260;260;120;120;260" keyTimes="0;0.42;0.54;0.88;1" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x" values="476;476;616;616;476" keyTimes="0;0.42;0.54;0.88;1" dur="7s" repeatCount="indefinite"/>
    </rect>
    <rect x="392" y="300" width="84" height="56" fill="var(--hot-soft)">
      <animate attributeName="width" values="84;84;224;224;84" keyTimes="0;0.42;0.54;0.88;1" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g clip-path="url(#bar)" fill="var(--own)" opacity="0.55">
    <animateTransform attributeName="transform" type="translate"
      values="0,0;0,0;140,0;140,0;0,0" keyTimes="0;0.42;0.54;0.88;1" dur="7s" repeatCount="indefinite"/>
    <rect x="492" y="312" width="26" height="14" rx="3"/><rect x="526" y="312" width="26" height="14" rx="3"/>
    <rect x="560" y="312" width="26" height="14" rx="3"/><rect x="594" y="312" width="26" height="14" rx="3"/>
    <rect x="628" y="312" width="26" height="14" rx="3"/><rect x="662" y="312" width="26" height="14" rx="3"/>
    <rect x="492" y="332" width="26" height="14" rx="3"/><rect x="526" y="332" width="26" height="14" rx="3"/>
    <rect x="560" y="332" width="26" height="14" rx="3"/><rect x="594" y="332" width="26" height="14" rx="3"/>
    <rect x="628" y="332" width="26" height="14" rx="3"/><rect x="662" y="332" width="26" height="14" rx="3"/>
  </g>
  <rect x="84" y="300" width="652" height="56" rx="9" fill="none" stroke="var(--edge)" stroke-width="1.4"/>
</g>
<g class="f">
  <text x="270" y="378" text-anchor="middle" class="lbl" fill="var(--hot)">RESERVED</text>
  <text x="270" y="396" text-anchor="middle" class="tiny">the OS, images, the job. never touched</text>
  <text x="606" y="378" text-anchor="middle" class="lbl" fill="var(--own)">BORROWED
    <animate attributeName="x" values="606;606;676;676;606" keyTimes="0;0.42;0.54;0.88;1" dur="7s" repeatCount="indefinite"/></text>
  <text x="606" y="396" text-anchor="middle" class="tiny">cached blocks. returned on demand
    <animate attributeName="x" values="606;606;676;676;606" keyTimes="0;0.42;0.54;0.88;1" dur="7s" repeatCount="indefinite"/></text>
</g>

<!-- ================= control plane ================= -->
<rect x="800" y="120" width="340" height="128" rx="16" fill="var(--ctl-soft)" stroke="var(--ctl)" stroke-width="1.4"/>
<g class="f">
  <text x="824" y="150" class="cap" fill="var(--ctl)">CONTROL PLANE</text>
  <text x="824" y="180" class="lbl">Grants capacity. Never on the read path.</text>
  <text x="824" y="202" class="sm">Proposes a lease; the node decides if it is real.</text>
  <text x="824" y="222" class="sm">Hands clients a layout, then gets out of the way.</text>
</g>
<g stroke="var(--ctl)" stroke-width="2" stroke-dasharray="7 6" fill="none" marker-end="url(#ctlArrow)">
  <path d="M800 190 L764 190"/>
</g>

<!-- ================= backends ================= -->
<rect x="800" y="292" width="340" height="128" rx="16" fill="var(--dur-soft)" stroke="var(--dur)" stroke-width="1.4"/>
<g class="f">
  <text x="824" y="322" class="cap">DURABLE BACKENDS</text>
  <text x="824" y="352" class="lbl">Ceph &#183; S3 &#183; whatever you already run</text>
  <text x="824" y="374" class="sm">Forebay stores nothing durably itself.</text>
  <text x="824" y="394" class="sm">A miss costs one read from here.</text>
</g>
<g stroke="var(--dur)" stroke-width="2" fill="none" marker-end="url(#durArrow)">
  <path d="M740 340 L792 340"/>
</g>
<text x="766" y="330" text-anchor="middle" class="f tiny">miss</text>

<!-- ================= the rule ================= -->
<rect x="60" y="470" width="1080" height="76" rx="14" fill="var(--own-soft)" stroke="var(--own)" stroke-width="1.4"/>
<g class="f">
  <text x="88" y="502" class="lbl" fill="var(--own)">Why giving it back is safe</text>
  <text x="88" y="528" class="rule">Borrowed capacity holds only data that can be fetched again, so returning it is a delete, never a migration.</text>
</g>

<!-- ================= legend ================= -->
<g class="f" transform="translate(60 580)">
  <rect x="0" y="0" width="14" height="14" rx="3" fill="var(--hot-soft)" stroke="var(--hot)"/>
  <text x="24" y="12" class="sm">not Forebay's</text>
  <rect x="170" y="0" width="14" height="14" rx="3" fill="var(--own-soft)" stroke="var(--own)"/>
  <text x="194" y="12" class="sm">borrowed, revocable</text>
  <rect x="380" y="0" width="14" height="14" rx="3" fill="var(--ctl-soft)" stroke="var(--ctl)"/>
  <text x="404" y="12" class="sm">control plane</text>
  <rect x="560" y="0" width="14" height="14" rx="3" fill="var(--dur-soft)" stroke="var(--dur)"/>
  <text x="584" y="12" class="sm">durable, someone else's</text>
  <text x="820" y="12" class="tiny">Nothing serves data yet. See the roadmap for what runs today.</text>
  <text x="0" y="34" class="sm">Measured on one GPU node: a 1.83 TiB device with 1.29 TiB lendable, and 7 GiB of borrowed capacity returned in 2.8 ms.</text>
</g>

<defs>
  <marker id="tealArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="var(--own)"/></marker>
  <marker id="ctlArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="var(--ctl)"/></marker>
  <marker id="durArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="var(--dur)"/></marker>
</defs>
</svg>
