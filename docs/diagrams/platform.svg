<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="The Forebay platform surface: consumers, file object and block access, data services, the control plane, the owned fast tier, and pluggable durable backends, with Kubernetes-native and compute-aware rails.">
<defs>
  <linearGradient id="pAcc" gradientUnits="userSpaceOnUse" x1="170" y1="140" x2="1030" y2="215"><stop offset="0" stop-color="#0C2A2A"/><stop offset="1" stop-color="#0A1A22"/></linearGradient>
  <linearGradient id="pSvc" gradientUnits="userSpaceOnUse" x1="170" y1="235" x2="1030" y2="350"><stop offset="0" stop-color="#191A46"/><stop offset="1" stop-color="#10142C"/></linearGradient>
  <linearGradient id="pCp"  gradientUnits="userSpaceOnUse" x1="170" y1="370" x2="1030" y2="485"><stop offset="0" stop-color="#221F5C"/><stop offset="1" stop-color="#141338"/></linearGradient>
  <linearGradient id="pFast" gradientUnits="userSpaceOnUse" x1="170" y1="505" x2="1030" y2="575"><stop offset="0" stop-color="#0F3A38"/><stop offset="1" stop-color="#0A2028"/></linearGradient>
  <linearGradient id="pSt"  gradientUnits="userSpaceOnUse" x1="170" y1="595" x2="1030" y2="670"><stop offset="0" stop-color="#141C2B"/><stop offset="1" stop-color="#0C1320"/></linearGradient>
  <radialGradient id="pGI" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#6366F1" stop-opacity="0.18"/><stop offset="1" stop-color="#6366F1" stop-opacity="0"/></radialGradient>
  <radialGradient id="pGT" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#14B8A6" stop-opacity="0.16"/><stop offset="1" stop-color="#14B8A6" stop-opacity="0"/></radialGradient>
  <pattern id="pD" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#182339"/></pattern>
  <filter id="pS" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/></filter>
  <marker id="pA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  <style>
    .f{font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    .band{font-size:11px;font-weight:700;letter-spacing:2px}
    .pill{font-size:12.5px;font-weight:600}
    .big{font-size:15px;font-weight:700}
    .sm{font-size:11.5px;fill:#65758E}
    .rail{font-size:11.5px;font-weight:700;letter-spacing:2px}
    .foot{font-size:11.5px;fill:#4E5E78}
  </style>
</defs>

<rect width="1200" height="760" rx="18" fill="#070C16"/>
<rect width="1200" height="760" rx="18" fill="url(#pD)" opacity="0.6"/>
<ellipse cx="600" cy="420" rx="640" ry="280" fill="url(#pGI)"/>
<ellipse cx="600" cy="700" rx="600" ry="220" fill="url(#pGT)"/>

<!-- rails -->
<rect x="40" y="60" width="110" height="610" rx="14" fill="#0B1524" stroke="#334155" stroke-width="1.2"/>
<text class="f rail" fill="#94A3B8" transform="rotate(-90 95 365)" x="95" y="365" text-anchor="middle">KUBERNETES NATIVE</text>
<text class="f sm" transform="rotate(-90 118 365)" x="118" y="365" text-anchor="middle">CRDs · operator · CSI · scheduler signals</text>

<rect x="1050" y="60" width="110" height="610" rx="14" fill="#0B1524" stroke="#14B8A6" stroke-width="1.3"/>
<text class="f rail" fill="#5EEAD4" transform="rotate(-90 1105 365)" x="1105" y="365" text-anchor="middle">COMPUTE AWARE</text>
<text class="f sm" fill="#5EEAD4" transform="rotate(-90 1128 365)" x="1128" y="365" text-anchor="middle">GPU · NUMA · PCIe · NIC · scheduler · telemetry</text>

<!-- consumers -->
<g class="f">
  <text x="170" y="48" class="band" fill="#5A6B85">CONSUMERS</text>
  <g class="pill" fill="#FDE68A">
    <rect x="179" y="60" width="158" height="32" rx="16" fill="#2E1D08" stroke="#B45309"/><text x="258" y="81" text-anchor="middle">training</text>
    <rect x="350" y="60" width="158" height="32" rx="16" fill="#2E1D08" stroke="#B45309"/><text x="429" y="81" text-anchor="middle">inference</text>
    <rect x="521" y="60" width="158" height="32" rx="16" fill="#2E1D08" stroke="#B45309"/><text x="600" y="81" text-anchor="middle">notebooks</text>
    <rect x="692" y="60" width="158" height="32" rx="16" fill="#2E1D08" stroke="#B45309"/><text x="771" y="81" text-anchor="middle">data pipelines</text>
    <rect x="863" y="60" width="158" height="32" rx="16" fill="#2E1D08" stroke="#B45309"/><text x="942" y="81" text-anchor="middle">CI and eval</text>
  </g>
</g>
<path d="M600 96 V132" stroke="#475569" stroke-width="1.4" marker-end="url(#pA)"/>

<!-- access -->
<g class="f" filter="url(#pS)"><rect x="170" y="136" width="860" height="86" rx="14" fill="url(#pAcc)" stroke="#0D9488" stroke-width="1.3"/></g>
<g class="f">
  <text x="190" y="160" class="band" fill="#5EEAD4">ACCESS &#183; one copy, several views</text>
  <g fill="#CCFBF1">
    <rect x="190"  y="172" width="270" height="36" rx="10" fill="#0F2E2E" stroke="#14B8A6"/>
    <text x="325" y="190" class="big" text-anchor="middle">FILE</text><text x="325" y="203" class="sm" fill="#5EEAD4" text-anchor="middle">pNFS · NFSv4.2 · NFSv3</text>
    <rect x="475"  y="172" width="270" height="36" rx="10" fill="#0F2E2E" stroke="#14B8A6"/>
    <text x="610" y="190" class="big" text-anchor="middle">OBJECT</text><text x="610" y="203" class="sm" fill="#5EEAD4" text-anchor="middle">S3</text>
    <rect x="760"  y="172" width="270" height="36" rx="10" fill="#111C2B" stroke="#475569"/>
    <text x="895" y="190" class="big" fill="#CBD5E1" text-anchor="middle">BLOCK</text><text x="895" y="203" class="sm" text-anchor="middle">CSI · same namespace and snapshots</text>
  </g>
</g>
<path d="M600 226 V252" stroke="#475569" stroke-width="1.4" marker-end="url(#pA)"/>

<!-- data services -->
<g class="f" filter="url(#pS)"><rect x="170" y="256" width="860" height="124" rx="14" fill="url(#pSvc)" stroke="#4F46E5" stroke-width="1.3"/></g>
<g class="f">
  <text x="190" y="280" class="band" fill="#A5B4FC">DATA SERVICES</text>
  <g class="pill" fill="#DCE6F4">
    <rect x="190" y="292" width="152" height="30" rx="15" fill="#241F5E" stroke="#4F46E5"/><text x="266" y="312" text-anchor="middle">snapshots</text>
    <rect x="356" y="292" width="152" height="30" rx="15" fill="#241F5E" stroke="#4F46E5"/><text x="432" y="312" text-anchor="middle">instant clones</text>
    <rect x="522" y="292" width="152" height="30" rx="15" fill="#241F5E" stroke="#4F46E5"/><text x="598" y="312" text-anchor="middle">version sharing</text>
    <rect x="688" y="292" width="152" height="30" rx="15" fill="#241F5E" stroke="#4F46E5"/><text x="764" y="312" text-anchor="middle">replication, DR</text>
    <rect x="854" y="292" width="152" height="30" rx="15" fill="#241F5E" stroke="#4F46E5"/><text x="930" y="312" text-anchor="middle">encryption</text>

    <rect x="190" y="330" width="152" height="30" rx="15" fill="#241F5E" stroke="#4F46E5"/><text x="266" y="350" text-anchor="middle">compression</text>
    <rect x="356" y="330" width="152" height="30" rx="15" fill="#241F5E" stroke="#4F46E5"/><text x="432" y="350" text-anchor="middle">thin provisioning</text>
    <rect x="522" y="330" width="152" height="30" rx="15" fill="#241F5E" stroke="#4F46E5"/><text x="598" y="350" text-anchor="middle">QoS and quotas</text>
    <rect x="688" y="330" width="152" height="30" rx="15" fill="#241F5E" stroke="#4F46E5"/><text x="764" y="350" text-anchor="middle">tiering</text>
    <rect x="854" y="330" width="152" height="30" rx="15" fill="#241F5E" stroke="#4F46E5"/><text x="930" y="350" text-anchor="middle">lineage</text>
  </g>
</g>
<path d="M600 384 V406" stroke="#475569" stroke-width="1.4" marker-end="url(#pA)"/>

<!-- control plane -->
<g class="f" filter="url(#pS)"><rect x="170" y="410" width="860" height="124" rx="14" fill="url(#pCp)" stroke="#6366F1" stroke-width="1.6"/></g>
<g class="f">
  <text x="190" y="434" class="band" fill="#C7D2FE">CONTROL PLANE &#183; declare the outcome, it decides the rest</text>
  <g class="pill" fill="#E0E7FF">
    <rect x="190" y="446" width="195" height="30" rx="15" fill="#312E81" stroke="#6366F1"/><text x="287" y="466" text-anchor="middle">intent and policy</text>
    <rect x="399" y="446" width="195" height="30" rx="15" fill="#312E81" stroke="#6366F1"/><text x="496" y="466" text-anchor="middle">topology model</text>
    <rect x="608" y="446" width="195" height="30" rx="15" fill="#312E81" stroke="#6366F1"/><text x="705" y="466" text-anchor="middle">elastic leases</text>
    <rect x="817" y="446" width="195" height="30" rx="15" fill="#312E81" stroke="#6366F1"/><text x="914" y="466" text-anchor="middle">autonomy loops</text>

    <rect x="190" y="484" width="195" height="30" rx="15" fill="#312E81" stroke="#6366F1"/><text x="287" y="504" text-anchor="middle">multi-tenancy, RBAC</text>
    <rect x="399" y="484" width="195" height="30" rx="15" fill="#312E81" stroke="#6366F1"/><text x="496" y="504" text-anchor="middle">audit</text>
    <rect x="608" y="484" width="195" height="30" rx="15" fill="#312E81" stroke="#6366F1"/><text x="705" y="504" text-anchor="middle">observability</text>
    <rect x="817" y="484" width="195" height="30" rx="15" fill="#312E81" stroke="#6366F1"/><text x="914" y="504" text-anchor="middle">capacity planning</text>
  </g>
</g>
<path d="M600 538 V560" stroke="#475569" stroke-width="1.4" marker-end="url(#pA)"/>

<!-- fast tier -->
<g class="f" filter="url(#pS)"><rect x="170" y="564" width="860" height="76" rx="14" fill="url(#pFast)" stroke="#2DD4BF" stroke-width="1.8"/></g>
<g class="f">
  <text x="190" y="588" class="band" fill="#5EEAD4">FAST TIER &#183; the one layer Forebay owns outright</text>
  <g class="pill" fill="#CCFBF1">
    <rect x="190" y="600" width="195" height="28" rx="14" fill="#0F3A38" stroke="#14B8A6"/><text x="287" y="619" text-anchor="middle">borrowed NVMe</text>
    <rect x="399" y="600" width="195" height="28" rx="14" fill="#0F3A38" stroke="#14B8A6"/><text x="496" y="619" text-anchor="middle">rack-local fabric</text>
    <rect x="608" y="600" width="195" height="28" rx="14" fill="#0F3A38" stroke="#14B8A6"/><text x="705" y="619" text-anchor="middle">prefetch</text>
    <rect x="817" y="600" width="195" height="28" rx="14" fill="#0F3A38" stroke="#14B8A6"/><text x="914" y="619" text-anchor="middle">checkpoint staging</text>
  </g>
</g>
<path d="M600 644 V666" stroke="#475569" stroke-width="1.4" marker-end="url(#pA)"/>

<!-- backends -->
<g class="f" filter="url(#pS)"><rect x="170" y="670" width="860" height="62" rx="14" fill="url(#pSt)" stroke="#475569" stroke-width="1.3"/></g>
<g class="f">
  <text x="190" y="692" class="band" fill="#94A3B8">DURABLE BACKENDS &#183; pluggable, capability negotiated</text>
  <g class="pill" fill="#CBD5E1">
    <rect x="190" y="700" width="140" height="26" rx="13" fill="#1B2537" stroke="#3B4A63"/><text x="260" y="718" text-anchor="middle">Ceph</text>
    <rect x="344" y="700" width="140" height="26" rx="13" fill="#1B2537" stroke="#3B4A63"/><text x="414" y="718" text-anchor="middle">OpenEBS</text>
    <rect x="498" y="700" width="140" height="26" rx="13" fill="#1B2537" stroke="#3B4A63"/><text x="568" y="718" text-anchor="middle">S3</text>
    <rect x="652" y="700" width="180" height="26" rx="13" fill="#1B2537" stroke="#3B4A63"/><text x="742" y="718" text-anchor="middle">your existing array</text>
    <rect x="846" y="700" width="166" height="26" rx="13" fill="#1B2537" stroke="#3B4A63"/><text x="929" y="718" text-anchor="middle">donated node NVMe</text>
  </g>
</g>

<text x="40" y="752" class="f foot">Design phase. Every layer above is planned or specified. None of it is shipped yet.</text>
<text x="1160" y="752" class="f foot" text-anchor="end">github.com/mayur-tolexo/forebay</text>
</svg>
