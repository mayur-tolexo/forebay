<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="Without Forebay: the same dataset copied once per protocol, per clone and per tier, NVMe sitting idle, and a GPU waiting on data. With Forebay: one copy read as file or object, the spare bytes working, and the GPU fed.">
<style>
  :root {
    --ink: #0F172A; --muted: #475569; --faint: #94A3B8;
    --card: #FFFFFF; --edge: #CBD5E1; --stage: #F8FAFC; --dead: #E2E8F0;
    --ctl: #4F46E5; --ctl-soft: #E0E7FF;
    --own: #0D9488; --own-soft: #CCFBF1;
    --hot: #B45309; --hot-soft: #FEF3C7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #E2E8F0; --muted: #94A3B8; --faint: #64748B;
      --card: #111A2B; --edge: #24344E; --stage: #0B1220; --dead: #1E293B;
      --ctl: #818CF8; --ctl-soft: #1E1B4B;
      --own: #2DD4BF; --own-soft: #042F2E;
      --hot: #FBBF24; --hot-soft: #451A03;
    }
  }
  .f { font-family: ui-sans-serif, -apple-system, "Segoe UI", Inter, Roboto, sans-serif; }
  .hd { font-size: 13px; font-weight: 800; letter-spacing: 1.6px; }
  .big { font-size: 19px; font-weight: 700; fill: var(--ink); }
  .sm { font-size: 13px; fill: var(--muted); }
  .chip { font-size: 12.5px; font-weight: 700; }
  .tiny { font-size: 11.5px; fill: var(--faint); }
</style>

<rect width="1200" height="520" fill="var(--stage)"/>

<!-- ============ without ============ -->
<rect x="40" y="40" width="530" height="410" rx="16" fill="var(--card)" stroke="var(--edge)" stroke-width="1.4"/>
<text x="70" y="82" class="f hd" fill="var(--faint)">WITHOUT</text>

<g class="f">
  <rect x="70"  y="104" width="150" height="30" rx="6" fill="var(--dead)" stroke="var(--edge)"/>
  <rect x="84"  y="118" width="150" height="30" rx="6" fill="var(--dead)" stroke="var(--edge)"/>
  <rect x="98"  y="132" width="150" height="30" rx="6" fill="var(--dead)" stroke="var(--edge)"/>
  <rect x="112" y="146" width="150" height="30" rx="6" fill="var(--dead)" stroke="var(--edge)"/>
  <text x="187" y="166" class="chip" fill="var(--muted)" text-anchor="middle">dataset v17</text>
  <text x="290" y="132" class="big">Four copies of the same bytes</text>
  <text x="290" y="156" class="sm">one per protocol, one per clone, one per tier</text>
</g>

<g class="f">
  <rect x="70" y="224" width="430" height="44" rx="9" fill="var(--dead)" stroke="var(--edge)" stroke-width="1.2"/>
  <rect x="70" y="224" width="96" height="44" rx="9" fill="var(--hot-soft)" stroke="var(--hot)" stroke-width="1.2"/>
  <text x="70" y="300" class="big">NVMe sitting idle</text>
  <text x="70" y="322" class="sm">bought, powered, doing nothing</text>
</g>

<g class="f">
  <rect x="70" y="352" width="120" height="56" rx="10" fill="var(--dead)" stroke="var(--edge)" stroke-width="1.2"/>
  <text x="130" y="386" class="chip" fill="var(--muted)" text-anchor="middle">GPU</text>
  <text x="210" y="378" class="big">Waiting on data</text>
  <text x="210" y="400" class="sm">the most expensive idle resource you own</text>
</g>

<!-- ============ divider ============ -->
<g stroke="var(--own)" stroke-width="3" fill="none" stroke-linecap="round">
  <path d="M584 232 L604 245 L584 258"/>
</g>

<!-- ============ with ============ -->
<rect x="630" y="40" width="530" height="410" rx="16" fill="var(--card)" stroke="var(--own)" stroke-width="1.6"/>
<text x="660" y="82" class="f hd" fill="var(--own)">WITH FOREBAY</text>

<g class="f">
  <rect x="660" y="118" width="150" height="34" rx="7" fill="var(--ctl-soft)" stroke="var(--ctl)" stroke-width="1.4"/>
  <text x="735" y="140" class="chip" fill="var(--ctl)" text-anchor="middle">dataset v17</text>
  <g stroke="var(--own)" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#kAr)">
    <path d="M818 128 L862 122"/><path d="M818 142 L862 154"/>
  </g>
  <rect x="870" y="108" width="96" height="26" rx="13" fill="var(--own-soft)" stroke="var(--own)"/>
  <text x="918" y="126" class="chip" fill="var(--own)" text-anchor="middle">file</text>
  <rect x="870" y="142" width="96" height="26" rx="13" fill="var(--own-soft)" stroke="var(--own)"/>
  <text x="918" y="160" class="chip" fill="var(--own)" text-anchor="middle">object</text>
  <text x="990" y="132" class="big">Written once.</text>
  <text x="990" y="156" class="sm" fill="var(--own)">Read either way. Copied never.</text>
</g>

<g class="f">
  <clipPath id="kBar"><rect x="660" y="224" width="430" height="44" rx="9"/></clipPath>
  <g clip-path="url(#kBar)">
    <rect x="660" y="224" width="258" height="44" fill="var(--hot-soft)"/>
    <rect x="918" y="224" width="172" height="44" fill="var(--own-soft)"/>
    <g fill="var(--own)" opacity="0.5">
      <rect x="930" y="234" width="22" height="11" rx="2"/><rect x="960" y="234" width="22" height="11" rx="2"/>
      <rect x="990" y="234" width="22" height="11" rx="2"/><rect x="1020" y="234" width="22" height="11" rx="2"/>
      <rect x="1050" y="234" width="22" height="11" rx="2"/>
      <rect x="930" y="249" width="22" height="11" rx="2"/><rect x="960" y="249" width="22" height="11" rx="2"/>
      <rect x="990" y="249" width="22" height="11" rx="2"/><rect x="1020" y="249" width="22" height="11" rx="2"/>
      <rect x="1050" y="249" width="22" height="11" rx="2"/>
    </g>
  </g>
  <rect x="660" y="224" width="430" height="44" rx="9" fill="none" stroke="var(--edge)" stroke-width="1.2"/>
  <text x="660" y="300" class="big">The spare bytes working</text>
  <text x="660" y="322" class="sm">borrowed on loan, returned the instant the job needs them</text>
</g>

<g class="f">
  <rect x="660" y="352" width="120" height="56" rx="10" fill="var(--hot-soft)" stroke="var(--hot)" stroke-width="1.4"/>
  <text x="720" y="386" class="chip" fill="var(--hot)" text-anchor="middle">GPU</text>
  <text x="800" y="378" class="big">Fed</text>
  <text x="800" y="400" class="sm">and nobody had to size a cache or migrate a byte</text>
</g>

<g class="f">
  <text x="40" y="490" class="tiny">The node agent runs and lends real capacity. Nothing serves data yet, and every performance claim here is unmeasured.</text>
  <text x="1160" y="490" text-anchor="end" class="tiny">github.com/mayur-tolexo/forebay</text>
</g>

<defs>
  <marker id="kAr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="var(--own)"/></marker>
</defs>
</svg>
